<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostGuard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .content {
      padding: 16px;
    }

    .toggle-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .toggle-section:last-child {
      border-bottom: none;
    }

    .toggle-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toggle-label span:first-child {
      font-size: 14px;
      font-weight: 500;
    }

    .toggle-label span:last-child {
      font-size: 11px;
      opacity: 0.6;
    }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255,255,255,0.2);
      transition: 0.3s;
      border-radius: 26px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    .toggle input:checked + .toggle-slider {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .toggle input:checked + .toggle-slider:before {
      transform: translateX(22px);
    }

    .stats {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    .stats h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.6;
      margin-bottom: 12px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
    }

    .stat-value {
      font-weight: 600;
      color: #667eea;
    }

    .strategy-select {
      width: 100%;
      padding: 8px 12px;
      margin-top: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }

    .strategy-select option {
      background: #1a1a2e;
      color: white;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.2);
    }

    .footer {
      padding: 12px 16px;
      text-align: center;
      font-size: 11px;
      opacity: 0.5;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>👻 GhostGuard</h1>
    <p>AI Privacy Shield</p>
  </div>

  <div class="content">
    <div class="toggle-section">
      <div class="toggle-label">
        <span>Enable Protection</span>
        <span>Auto-redact sensitive data</span>
      </div>
      <label class="toggle">
        <input type="checkbox" id="enabled" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="toggle-section">
      <div class="toggle-label">
        <span>Show Notifications</span>
        <span>Display when data is protected</span>
      </div>
      <label class="toggle">
        <input type="checkbox" id="showIndicator" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="toggle-section">
      <div class="toggle-label">
        <span>Strategy</span>
        <span>How to hide sensitive data</span>
      </div>
    </div>
    <select class="strategy-select" id="strategy">
      <option value="placeholder">Placeholder [REDACTED]</option>
      <option value="mask">Mask 138****5678</option>
      <option value="remove">Remove completely</option>
    </select>

    <div class="stats">
      <h3>Statistics</h3>
      <div class="stat-row">
        <span>Items Protected</span>
        <span class="stat-value" id="detectedCount">0</span>
      </div>
      <div class="stat-row">
        <span>Active Tabs</span>
        <span class="stat-value" id="activeTabs">0</span>
      </div>
    </div>

    <button class="btn btn-secondary" id="clearStats">Reset Statistics</button>
  </div>

  <div class="footer">
    <a href="https://github.com/ghostguard/ghostguard" target="_blank">GhostGuard v0.1.0</a>
  </div>

  <script src="src/popup.js"></script>
</body>
</html>
